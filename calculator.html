<!doctype html>
<html ng-app>
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif, Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            color: #07025a;
        }
        input {
            margin: 5px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        h3 {
            color: #07025a;
        }
    </style>
  </head>
  <body>
    <h2>Calculator</h2>
    <div ng-init="a=0; b=0; result=0">
      <input type="number" ng-model="a" placeholder="Enter first number" />
      <input type="number" ng-model="b" placeholder="Enter second number" />
      <br /><br />
      <button ng-click="result = a + b">+</button>
      <button ng-click="result = a - b">-</button>
      <button ng-click="result = a * b">*</button>
      <button ng-click="result = (b != 0) ? (a / b) : 'Division by zero'">
        /
      </button>
      <h3>Result: {{result}}</h3>
    </div>
  </body>
</html>
